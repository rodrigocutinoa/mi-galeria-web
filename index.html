<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/estilos.css" />
    <title>Mi Galería de Películas</title>
  </head>
  <body>
    <div class="contenedor">

      <aside class="sidebar" aria-label="Filtros de búsqueda">

        <div class="sidebar__logo">
          <img
            class="sidebar__logo-imagen"
            src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_square_2-d537fb228cf3ded904ef09b136fe3fec72548ebc1fea3fbbd1ad9e36364db38b.svg"
            alt="Logo The Movie Database"
          />
        </div>

        <div class="sidebar__generos">
          <h2 class="sidebar__titulo">Géneros</h2>
          <nav aria-label="Filtro por género">
            <div
              class="sidebar__contenedor-generos"
              id="filtro-generos"
              role="group"
              aria-label="Botones de género"
            ></div>
          </nav>
        </div>

        <div class="sidebar__anos">
          <h2 class="sidebar__titulo">Buscar por Años</h2>
          <div class="sidebar__contenedor-inputs">
            <label for="anos-min" class="sr-only">Año mínimo</label>
            <input
              class="sidebar__input"
              id="anos-min"
              type="number"
              min="1950"
              max="2024"
              placeholder="1950"
            />
            <span aria-hidden="true">—</span>
            <label for="anos-max" class="sr-only">Año máximo</label>
            <input
              class="sidebar__input"
              id="anos-max"
              type="number"
              min="1950"
              max="20256"
              value="2026"
              placeholder="2026"
            />
          </div>
        </div>

        <!-- AGREGA ESTO antes del div.sidebar__buscar -->
        <div class="sidebar__nombre">
          <h2 class="sidebar__titulo">Buscar por nombre</h2>
          <label for="input-nombre" class="sr-only">Nombre de película o serie</label>
          <input
            class="sidebar__input"
            id="input-nombre"
            type="text"
            placeholder="Ej: Inception..."
            autocomplete="off"
          />
        </div>

        <div class="sidebar__buscar">

        <div class="sidebar__buscar">
          <button class="btn btn--100 btn--rojo" id="btn-buscar">
            Buscar
          </button>
        </div>

      </aside>

      <main class="main" id="contenido-principal">

        <div class="main__filtros" role="group" aria-label="Tipo de contenido">
          <button class="btn btn--active" id="movie" aria-pressed="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="btn__icono" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M0 1a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V1zm4 0v6h8V1H4zm8 8H4v6h8V9zM1 1v2h2V1H1zm2 3H1v2h2V4zM1 7v2h2V7H1zm2 3H1v2h2v-2zm-2 3v2h2v-2H1zM15 1h-2v2h2V1zm-2 3v2h2V4h-2zm2 3h-2v2h2V7zm-2 3v2h2v-2h-2zm2 3h-2v2h2v-2z"/>
            </svg>
            Películas
          </button>
          <button class="btn" id="tv" aria-pressed="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="btn__icono" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2.5 13.5A.5.5 0 0 1 3 13h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zM13.991 3l.024.001a1.46 1.46 0 0 1 .538.143.757.757 0 0 1 .302.254c.067.1.145.277.145.602v5.991l-.001.024a1.464 1.464 0 0 1-.143.538.758.758 0 0 1-.254.302c-.1.067-.277.145-.602.145H2.009l-.024-.001a1.464 1.464 0 0 1-.538-.143.758.758 0 0 1-.302-.254C1.078 10.502 1 10.325 1 10V4.009l.001-.024a1.46 1.46 0 0 1 .143-.538.758.758 0 0 1 .254-.302C1.498 3.078 1.675 3 2 3h11.991zM14 2H2C0 2 0 4 0 4v6c0 2 2 2 2 2h12c2 0 2-2 2-2V4c0-2-2-2-2-2z"/>
            </svg>
            Series
          </button>
        </div>

        <section id="galeria" aria-label="Resultados">
          <h1 class="main__titulo" id="titulo-galeria">Películas Populares</h1>
          <div class="main__grid" id="populares" data-pagina="1"></div>
        </section>

        <div id="estado" class="estado" role="status" aria-live="polite" hidden></div>

        <nav class="main__paginacion" aria-label="Paginación">
          <button class="btn" id="pagina-anterior" aria-label="Página anterior">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="btn__icono" viewBox="0 0 16 16" aria-hidden="true">
              <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
            </svg>
            Anterior
          </button>
          <span class="main__pagina-num" id="num-pagina" aria-live="polite">Página 1</span>
          <button class="btn" id="pagina-siguiente" aria-label="Página siguiente">
            Siguiente
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="btn__icono" viewBox="0 0 16 16" aria-hidden="true">
              <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z"/>
            </svg>
          </button>
        </nav>

      </main>

      <section class="media" id="media" role="dialog" aria-modal="true" aria-label="Detalle del título" hidden>
        <div class="media__contenedor" id="media-contenedor"></div>
      </section>

    </div>

    <script src="js/app.js"></script>
  </body>
</html>
